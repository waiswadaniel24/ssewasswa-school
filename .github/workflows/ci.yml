name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies (lenient mode — handles peer dep conflicts)
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Lint (non-blocking — warns but doesn't fail build)
        run: npm run lint
        continue-on-error: true

      - name: Build Vite frontend
        run: npm run build
        env:
          NODE_ENV: production
