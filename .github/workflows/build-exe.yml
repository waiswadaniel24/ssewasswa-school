name: Build Windows Installer (.exe)

on:
  workflow_dispatch:  # Manual trigger from GitHub Actions tab
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'electron/**'
      - '.github/workflows/build-exe.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build Vite frontend
        run: npm run build

      - name: 🖥️ Package Electron app for Windows
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing for now (would need paid cert)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 📤 Upload installer (.exe) as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ssewasswa-School-ERP-Windows-Installer
          path: |
            release/Ssewasswa School ERP V10 Setup.exe
            release/*.exe
          retention-days: 90
          if-no-files-found: warn

      - name: 📋 List build artifacts
        if: always()
        run: |
          echo "Build artifacts in release/ folder:"
          dir release\\ /s /b 2>nul || true
