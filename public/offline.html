<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Ssewasswa School ERP</title>
  <style>
    body { margin:0; padding:0; min-height:100vh; background:#071b2f; color:#f7fbff;
           font-family:'Segoe UI',sans-serif; display:flex; align-items:center; justify-content:center; }
    .box { text-align:center; max-width:480px; padding:40px 24px; }
    img { width:80px; height:80px; object-fit:contain; background:#fff; border-radius:16px; padding:8px; margin-bottom:20px; }
    h1 { margin:0 0 12px; font-size:28px; }
    p { color:#b5c9d7; line-height:1.6; margin:0 0 24px; }
    button { background:#61d3a5; color:#062218; border:0; border-radius:10px;
             padding:14px 28px; font-size:16px; font-weight:700; cursor:pointer; }
    button:hover { background:#4ec295; }
    .hint { margin-top:24px; color:#7fa0b5; font-size:13px; }
  </style>
</head>
<body>
  <div class="box">
    <img src="/ssewasswa-comforts-school-erp-mark.png" alt="Ssewasswa" />
    <h1>You're offline</h1>
    <p>The Ssewasswa Comforts School ERP needs an internet connection to load this page. Please check your network and try again.</p>
    <button onclick="window.location.reload()">Try again</button>
    <p class="hint">If you're using the desktop app, it should still work — most features are available offline.</p>
  </div>
</body>
</html>
